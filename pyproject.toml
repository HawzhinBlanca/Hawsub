[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hawsub"
version = "1.0.0"
description = "Production-oriented English -> Central Kurdish (Sorani, ckb) cinematic subtitle localization system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "httpx2>=2.0.0",
    "ruff>=0.5.0",
]
asr = [
    "faster-whisper>=0.10.0",
]

[project.scripts]
hawsub = "hawsub.cli.main:cli"

[tool.setuptools.packages.find]
include = ["hawsub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: marks tests that require real API keys and network access (deselect with '-m \"not integration\"')",
]

