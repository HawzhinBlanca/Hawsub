[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hawsub"
version = "1.0.0"
description = "Production-oriented English -> Central Kurdish (Sorani, ckb) cinematic subtitle localization system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
hawsub = "hawsub.cli.main:cli"

[tool.setuptools.packages.find]
include = ["hawsub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
