name: Hawsub CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check hawsub/ tests/

      - name: Run Ruff Formatter Check
        run: ruff format --check hawsub/ tests/

  test:
    name: Test & Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Hawsub Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage Gate
        run: |
          pytest tests/ -v --cov=hawsub --cov-report=term-missing --cov-fail-under=75

      - name: Run Hawsub Gold Benchmark Evaluation
        run: |
          hawsub benchmark --provider mock --model gemini-2.5-pro

      - name: Verify CLI Command Surface
        run: |
          hawsub --version
          hawsub normalize -t "سڵاو"

      - name: Upload Coverage Report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t hawsub:ci-test .

      - name: Verify Docker Health Check
        run: |
          docker run -d --name hawsub-test -p 8080:8080 hawsub:ci-test
          sleep 10
          curl -f http://localhost:8080/api/health || exit 1
          docker stop hawsub-test
          docker rm hawsub-test

  benchmark-regression:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e ".[dev]"

      - name: Run Benchmark & Check Score
        run: |
          python -c "
          from hawsub.benchmark.suite import BenchmarkSuite
          from hawsub.providers.factory import get_provider
          model = get_provider(provider_name='mock', model_name='gemini-2.5-pro')
          suite = BenchmarkSuite(dataset_path='tests/gold/gold_dataset.json')
          report = suite.evaluate_model(model)
          print(f'Benchmark Score: {report.overall_benchmark_score}')
          print(f'chrF Score: {report.overall_chrf_score}')
          print(f'Items: {report.total_items}')
          print(f'Passed: {report.passed_items}')
          assert report.total_items >= 200, f'Benchmark must have >= 200 items, got {report.total_items}'
          assert report.overall_benchmark_score >= 0.4, f'Score dropped below 0.4: {report.overall_benchmark_score}'
          print('✅ Benchmark regression check PASSED')
          "
