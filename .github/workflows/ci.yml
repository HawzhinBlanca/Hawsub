name: Hawsub CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Hawsub Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=hawsub --cov-report=term-missing

      - name: Run Hawsub Gold Benchmark Evaluation
        run: |
          hawsub benchmark --provider mock --model gemini-2.5-pro

      - name: Verify CLI Command Surface
        run: |
          hawsub --version
          hawsub normalize -t "سڵاو"
